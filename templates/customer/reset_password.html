{% extends "base.html" %}

{% block page_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/customer.css') }}">
{% endblock %}

{% block title %}Redefinir Senha - Val's{% endblock %}

{% block content %}
<section class="auth-section">
    <div class="container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-badge"><i class="fas fa-key"></i></div>
                <h1>Nova Senha</h1>
                <p>Escolha uma nova senha para sua conta</p>
            </div>

            <form action="{{ url_for('reset_password', token=token) }}" method="post" class="auth-form">
                <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">

                <div class="form-group">
                    <label>Nova Senha</label>
                    <input type="password" name="password" required minlength="8" placeholder="Minimo 8 caracteres">
                </div>

                <div class="form-group">
                    <label>Confirmar Nova Senha</label>
                    <input type="password" name="confirm_password" required minlength="8" placeholder="Repita a senha">
                </div>

                <button type="submit" class="btn-primary">Redefinir Senha</button>
            </form>
        </div>
    </div>
</section>
{% endblock %}
