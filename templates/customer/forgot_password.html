{% extends "base.html" %}

{% block page_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/customer.css') }}">
{% endblock %}

{% block title %}Recuperar Senha - Val's{% endblock %}

{% block content %}
<section class="auth-section">
    <div class="container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-badge"><i class="fas fa-envelope"></i></div>
                <h1>Recuperar Senha</h1>
                <p>Informe seu e-mail para receber o link de recuperacao</p>
            </div>

            <form action="{{ url_for('forgot_password') }}" method="post" class="auth-form">
                <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">

                <div class="form-group">
                    <label>Email</label>
                    <input type="email" name="email" required placeholder="seu@email.com">
                </div>

                <div class="form-group captcha-group">
                    <label>Quanto e {{ captcha_question }}?</label>
                    <input type="number" name="captcha" required placeholder="Resposta">
                </div>

                <button type="submit" class="btn-primary">Enviar Link</button>
            </form>

            <div class="auth-footer">
                <p>Lembrou a senha? <a href="{{ url_for('customer_login') }}">Fazer login</a></p>
            </div>
        </div>
    </div>
</section>
{% endblock %}
