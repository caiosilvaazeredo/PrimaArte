{% extends "base.html" %}

{% block page_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/customer.css') }}">
{% endblock %}

{% block title %}Cadastro - Val's{% endblock %}

{% block content %}
<section class="auth-section">
    <div class="container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-badge"><i class="fas fa-user-plus"></i></div>
                <h1>Criar Conta</h1>
                <p>Junte-se a Val's para uma experiencia exclusiva</p>
            </div>

            <form action="{{ url_for('customer_register') }}" method="post" class="auth-form">
                <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">

                <div class="form-row">
                    <div class="form-group">
                        <label>Nome Completo *</label>
                        <input type="text" name="name" required placeholder="Seu nome completo">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Email *</label>
                        <input type="email" name="email" required placeholder="seu@email.com">
                    </div>
                </div>

                <div class="form-row form-row-2">
                    <div class="form-group">
                        <label>CPF</label>
                        <input type="text" name="cpf" placeholder="000.000.000-00">
                    </div>
                    <div class="form-group">
                        <label>Telefone</label>
                        <input type="text" name="phone" placeholder="(21) 99999-9999">
                    </div>
                </div>

                <div class="form-row form-row-2">
                    <div class="form-group">
                        <label>Senha *</label>
                        <input type="password" name="password" required minlength="8" placeholder="Minimo 8 caracteres">
                    </div>
                    <div class="form-group">
                        <label>Confirmar Senha *</label>
                        <input type="password" name="confirm_password" required placeholder="Repita a senha">
                    </div>
                </div>

                <div class="form-group captcha-group">
                    <label>Verificação: Quanto e {{ captcha_question }}?</label>
                    <input type="text" name="captcha" required placeholder="Sua resposta" autocomplete="off">
                </div>

                <button type="submit" class="btn-auth">
                    <span>Criar Conta</span>
                    <i class="fas fa-arrow-right"></i>
                </button>

                <div class="auth-footer">
                    <p>Ja tem uma conta? <a href="{{ url_for('customer_login') }}">Faca login</a></p>
                </div>
            </form>
        </div>
    </div>
</section>
{% endblock %}
