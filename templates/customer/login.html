{% extends "base.html" %}

{% block page_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/customer.css') }}">
{% endblock %}

{% block title %}Login - Val's{% endblock %}

{% block content %}
<section class="auth-section">
    <div class="container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-badge"><i class="fas fa-lock"></i></div>
                <h1>Entrar</h1>
                <p>Acesse sua conta Val's</p>
            </div>

            <form action="{{ url_for('customer_login') }}" method="post" class="auth-form">
                <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">

                <div class="form-group">
                    <label>Email</label>
                    <input type="email" name="email" required placeholder="seu@email.com">
                </div>

                <div class="form-group">
                    <label>Senha</label>
                    <input type="password" name="password" required placeholder="Sua senha">
                </div>

                <div class="form-group captcha-group">
                    <label>Verificacao: Quanto e {{ captcha_question }}?</label>
                    <input type="text" name="captcha" required placeholder="Sua resposta" autocomplete="off">
                </div>

                <button type="submit" class="btn-auth">
                    <span>Entrar</span>
                    <i class="fas fa-arrow-right"></i>
                </button>

                <div class="auth-footer">
                    <p><a href="{{ url_for('forgot_password') }}">Esqueci minha senha</a></p>
                    <p>Nao tem conta? <a href="{{ url_for('customer_register') }}">Cadastre-se</a></p>
                </div>
            </form>
        </div>
    </div>
</section>
{% endblock %}
